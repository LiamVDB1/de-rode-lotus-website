media:
  input: public/uploads
  output: /uploads
  rename: safe
  extensions: [jpg, jpeg, png, webp, avif]

content:
  - name: home
    label: "Startpagina"
    type: file
    path: src/data/home.json
    format: json
    fields:
      - name: pageTitle
        label: "Titel in browsertab"
        type: string
        required: true
        options: { maxlength: 100 }
      - name: metaDescription
        label: "Beschrijving voor zoekmachines"
        type: text
        required: true
        options: { maxlength: 180 }
      - name: heroTitle
        label: "Grote welkomsttitel"
        type: string
        required: true
        options: { maxlength: 100 }
      - name: heroIntro
        label: "Tekst op de grote foto"
        type: text
        required: true
        options: { maxlength: 260 }
      - name: heroPhoto
        label: "Grote foto"
        type: image
        description: "Zolang dit leeg is, toont de werkversie de huidige voorbeeldfoto. Upload een echte foto met publicatierechten."
      - name: heroPhotoAlt
        label: "Beschrijf de grote foto"
        type: string
        required: true
        options: { maxlength: 180 }
      - name: servicesTitle
        label: "Titel activiteiten"
        type: string
        required: true
        options: { maxlength: 100 }
      - name: servicesIntro
        label: "Intro activiteiten"
        type: text
        required: true
        options: { maxlength: 350 }
      - name: storyTitle
        label: "Titel over de ontmoetingsplek"
        type: string
        required: true
        options: { maxlength: 100 }
      - name: storyText
        label: "Tekst over de ontmoetingsplek"
        type: text
        required: true
        options: { maxlength: 450 }
      - name: storyPhoto
        label: "Foto ontmoetingsplek"
        type: image
        description: "Zolang dit leeg is, toont de werkversie de huidige voorbeeldfoto. Upload een echte foto met publicatierechten."
      - name: storyPhotoAlt
        label: "Beschrijf de foto van de ontmoetingsplek"
        type: string
        required: true
        options: { maxlength: 180 }
      - name: helpTitle
        label: "Titel meehelpen"
        type: string
        required: true
        options: { maxlength: 100 }
      - name: helpIntro
        label: "Tekst meehelpen"
        type: text
        required: true
        options: { maxlength: 350 }
      - name: faqTitle
        label: "Titel vragen"
        type: string
        required: true
        options: { maxlength: 100 }
      - name: faqIntro
        label: "Intro vragen"
        type: text
        required: true
        options: { maxlength: 350 }

  - name: practical
    label: "Adres, contact en uren"
    type: file
    path: src/data/practical.json
    format: json
    fields:
      - name: street
        label: "Straat en huisnummer"
        type: string
        required: true
      - name: postalCode
        label: "Postcode"
        type: string
        required: true
      - name: city
        label: "Stad"
        type: string
        required: true
      - name: neighbourhood
        label: "Buurt"
        type: string
        required: true
      - name: phoneDisplay
        label: "Telefoonnummer zoals bezoekers het zien"
        type: string
        required: true
      - name: phoneInternational
        label: "Telefoonnummer voor bellen (+32...)"
        type: string
        required: true
        pattern: "^\\+[0-9]{8,15}$"
      - name: email
        label: "E-mailadres"
        type: string
        required: true
      - name: hoursTitle
        label: "Titel openingsuren"
        type: string
        required: true
      - name: hoursIntro
        label: "Uitleg bij de openingsuren"
        type: text
        required: true
      - name: hours
        label: "Openingsdagen en uren"
        type: object
        list:
          min: 1
          max: 7
          collapsible:
            collapsed: true
            summary: "{day}"
        fields:
          - name: day
            label: "Dag"
            type: string
            required: true
          - name: time
            label: "Uren (bv. 10u–12u · 13u–17u)"
            type: string
            required: true
          - name: activity
            label: "Wat is er dan open?"
            type: text
            required: true

  - name: activities
    label: "Wat we doen"
    type: file
    path: src/data/activities.json
    format: json
    list: true
    fields:
      - name: title
        label: "Naam activiteit"
        type: string
        required: true
      - name: description
        label: "Korte uitleg"
        type: text
        required: true
      - name: photo
        label: "Foto"
        type: image
        description: "Bij bestaande activiteiten toont de werkversie een voorbeeldfoto zolang dit leeg is. Upload een echte foto met publicatierechten."
      - name: photoAlt
        label: "Beschrijf de foto"
        type: string
        required: true
      - name: linkText
        label: "Tekst van de link"
        type: string
        required: true
      - name: linkTarget
        label: "Waar gaat de link naartoe?"
        type: select
        required: true
        options:
          values:
            - name: faq
              label: "Veelgestelde vragen"
            - name: practical
              label: "Openingsuren"
            - name: email
              label: "E-mail sturen"

  - name: faq
    label: "Veelgestelde vragen"
    type: file
    path: src/data/faq.json
    format: json
    list: true
    fields:
      - name: question
        label: "Vraag"
        type: string
        required: true
      - name: answer
        label: "Antwoord"
        type: text
        required: true

  - name: notice
    label: "Actuele mededeling"
    type: file
    path: src/data/notice.json
    format: json
    fields:
      - name: enabled
        label: "Mededeling tonen"
        type: boolean
      - name: title
        label: "Korte titel"
        type: string
      - name: message
        label: "Bericht"
        type: text
      - name: until
        label: "Automatisch verbergen na (JJJJ-MM-DD, optioneel)"
        type: string
        pattern: "^$|^[0-9]{4}-[0-9]{2}-[0-9]{2}$"
